<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corbyte - Nos PC</title>


<style>

body {
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}


h1 {

    text-align:center;
    color:#ff003c;
    font-size:45px;
    margin-top:40px;

}



.panier {

    position:absolute;
    top:25px;
    right:30px;

}


.panier button {

    background:#ff003c;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;

}



.pc-card {

    width:550px;

    margin:70px auto;

    background:#111;

    border:2px solid #ff003c;

    border-radius:20px;

    padding:20px;

    display:flex;

    align-items:center;

    gap:25px;

}



.image-box {

    width:100px;
    height:100px;

    border:2px solid #ff003c;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}



.image-box img {

    width:100%;
    height:100%;

    object-fit:contain;

}



.info h2 {

    margin:0;

    font-size:28px;

}



.info p {

    color:#ccc;

}



.price {

    color:#ff003c;

    font-size:25px;

    font-weight:bold;

}



button {

    background:#ff003c;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:10px;

    cursor:pointer;

}



</style>

</head>



<body>


<div class="panier">

<button>
🛒 Panier
</button>

</div>



<h1>
Nos PC Gaming
</h1>




<div class="pc-card">



<div class="image-box">

<img src="shadow-pc.png" alt="Corbyte Shadow">

</div>




<div class="info">


<h2>
Corbyte Shadow
</h2>


<p>
Ryzen 7 5700X • RX 9060 XT 16 Go
</p>



<div class="price">
1295 €
</div>



<br>



<a href="shadow.html">

<button>
Voir les détails
</button>

</a>



</div>


</div>



</body>

</html>
