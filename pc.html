<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corbyte - Nos PC</title>


<style>

body {
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}


h1 {
    text-align:center;
    color:#ff003c;
    font-size:40px;
    margin-top:40px;
}


/* Carte PC */

.pc-card {

    width:400px;

    margin:60px auto;

    background:#111;

    border:2px solid #ff003c;

    border-radius:18px;

    padding:15px;

    display:flex;

    align-items:center;

    gap:18px;

}


/* Petit carré image */

.image-box {

    width:80px;

    height:80px;

    border:2px solid #ff003c;

    border-radius:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

}



.image-box img {

    width:100%;

    height:100%;

    object-fit:contain;

}



/* Texte */

.info h2 {

    margin:0;

    font-size:22px;

}


.info p {

    margin:8px 0;

    color:#ccc;

    font-size:14px;

}



.price {

    color:#ff003c;

    font-size:22px;

    font-weight:bold;

    margin-bottom:10px;

}



button {

    background:#ff003c;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    cursor:pointer;

    font-size:14px;

}



button:hover {

    background:#cc0030;

}


</style>


</head>


<body>


<h1>
Nos PC Gaming
</h1>



<div class="pc-card">


<div class="image-box">

<img src="shadow-pc.png" alt="Corbyte Shadow">

</div>



<div class="info">


<h2>
Corbyte Shadow
</h2>


<p>
Ryzen 7 5700X<br>
RX 9060 XT 16 Go
</p>


<div class="price">
1295 €
</div>



<a href="shadow.html">

<button>
Voir les détails
</button>

</a>



</div>


</div>



</body>

</html>
