<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corbyte - Nos PC</title>

<style>

body {
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
}


h1 {
    color:#ff003c;
    font-size:45px;
    margin:40px;
}



/* Carte PC */

.pc-card {

    margin-left:40px;
    margin-top:50px;

    width:520px;

    background:#111;

    border:2px solid #ff003c;

    border-radius:20px;

    padding:20px;

    display:flex;

    align-items:center;

}


/* Carré image */

.image-box {

    width:130px;
    height:130px;

    border:2px solid #ff003c;

    border-radius:15px;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-right:25px;

}



.image-box img {

    width:100%;
    height:100%;

    object-fit:contain;

}



/* Texte */

.info h2 {

    margin:0;

    font-size:28px;

}



.info p {

    color:#cccccc;

}



.price {

    color:#ff003c;

    font-size:26px;

    font-weight:bold;

    margin:15px 0;

}



button {

    background:#ff003c;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

}



button:hover {

    background:#b8002d;

}


</style>

</head>


<body>


<h1>
Nos PC Gaming
</h1>



<div class="pc-card">


<div class="image-box">

<img src="shadow-pc.png" alt="Corbyte Shadow">

</div>



<div class="info">


<h2>
Corbyte Shadow
</h2>


<p>
Ryzen 7 5700X<br>
RX 9060 XT 16 Go
</p>



<div class="price">
1295 €
</div>



<a href="shadow.html">

<button>
Voir les détails
</button>

</a>



</div>


</div>



</body>

</html>
