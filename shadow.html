<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corbyte Shadow</title>

<style>

body {
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
}


h1 {
    color:#ff003c;
}


.card {

    width:600px;
    margin:50px auto;
    background:#111;
    border:2px solid #ff003c;
    border-radius:20px;
    padding:30px;

}


img {

    width:300px;

}


.prix {

    color:#ff003c;
    font-size:30px;
    font-weight:bold;

}


button {

    background:#ff003c;
    color:white;
    border:0;
    padding:15px 30px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;

}


#resultat {

    margin-top:20px;
    color:#00ff66;
    font-size:20px;

}

</style>


</head>


<body>


<h1>
Corbyte Shadow
</h1>


<div class="card">


<img src="shadow-pc.png">


<h2>
PC Gaming RX 9060 XT
</h2>


<div class="prix">
1295 €
</div>


<h2>
Composants
</h2>


<p>

AMD Ryzen 7 5700X<br>
Sapphire RX 9060 XT 16 Go<br>
Patriot Viper Steel 16 Go DDR4<br>
Silicon Power NVMe 1 To<br>
MSI B550 Gaming WiFi<br>
Thermalright Assassin X120 ARGB<br>
MSI MAG A650BN 650W<br>
MSI MAG Forge 120A Airflow

</p>


<button onclick="ajouter()">

Ajouter au panier

</button>


<div id="resultat"></div>


</div>




<script>

function ajouter(){

document.getElementById("resultat").innerHTML =
"✅ Corbyte Shadow ajouté au panier";

}


</script>


</body>

</html>
