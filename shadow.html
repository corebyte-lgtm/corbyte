<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corbyte Shadow</title>

<style>

body {
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}


.panier-icon {

    position:fixed;
    top:20px;
    right:30px;

    background:#ff003c;
    padding:12px 18px;

    border-radius:15px;

}


.panier-icon a {

    color:white;
    text-decoration:none;
    font-size:20px;

}



.container {

    text-align:center;
    padding:40px;

}


h1 {

    color:#ff003c;

}


.card {

    max-width:700px;
    margin:auto;

    background:#111;

    border:2px solid #ff003c;

    border-radius:20px;

    padding:30px;

}


img {

    width:300px;

}


.price {

    color:#ff003c;

    font-size:30px;

    font-weight:bold;

}


button {

    background:#ff003c;
    color:white;

    border:none;

    padding:15px 30px;

    border-radius:10px;

    cursor:pointer;

}


</style>

</head>


<body>



<div class="panier-icon">

<a href="panier.html">

🛒 <span id="nombre">0</span>

</a>

</div>




<div class="container">


<h1>
CORBYTE SHADOW
</h1>



<div class="card">


<img src="shadow-pc.png">



<h2>
PC Gaming RX 9060 XT
</h2>



<div class="price">
1295 €
</div>



<h3>
Configuration
</h3>


<p>
Ryzen 7 5700X<br>
RX 9060 XT 16 Go<br>
16 Go RAM DDR4<br>
SSD NVMe 1 To<br>
MSI B550 Gaming WiFi
</p>



<button onclick="ajouterPanier()">

Ajouter au panier

</button>



</div>

</div>



<script>


function ajouterPanier(){


localStorage.setItem("panier","Corbyte Shadow");


localStorage.setItem("prix","1295");



document.getElementById("nombre").innerHTML="1";


}



</script>



</body>

</html>
