<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corbyte Shadow</title>

<style>

body {
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}


.panier {

    position:fixed;
    top:20px;
    right:30px;

    background:#ff003c;
    padding:12px 20px;
    border-radius:12px;

}


.panier a {

    color:white;
    text-decoration:none;

    font-size:22px;

}



.container {

    text-align:center;

    padding:40px;

}



h1 {

    color:#ff003c;

}



.card {

    width:700px;

    max-width:90%;

    margin:auto;

    background:#111;

    border:2px solid #ff003c;

    border-radius:20px;

    padding:30px;

}



.card img {

    width:300px;

}



.price {

    color:#ff003c;

    font-size:30px;

    font-weight:bold;

}



li {

    text-align:left;

    margin:8px;

}



button {

    background:#ff003c;

    color:white;

    border:0;

    padding:15px 30px;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;

}


#message {

    margin-top:20px;

    color:#00ff66;

    font-size:20px;

}


</style>

</head>


<body>



<div class="panier">

<a href="panier.html">

🛒 <span id="compteur">0</span>

</a>

</div>



<div class="container">


<h1>
CORBYTE SHADOW
</h1>



<div class="card">


<img src="shadow-pc.png">



<h2>
PC Gaming RX 9060 XT
</h2>


<div class="price">
1295 €
</div>



<ul>

<li>AMD Ryzen 7 5700X</li>

<li>Sapphire RX 9060 XT 16 Go</li>

<li>Patriot Viper Steel DDR4 16 Go</li>

<li>Silicon Power NVMe 1 To</li>

<li>MSI B550 Gaming WiFi</li>

<li>Thermalright Assassin X120 ARGB</li>

<li>MSI MAG A650BN 650W</li>

<li>MSI MAG Forge 120A Airflow</li>

</ul>



<button onclick="ajouterAuPanier()">

Ajouter au panier

</button>



<div id="message"></div>


</div>


</div>




<script>


function ajouterAuPanier(){


let panier = localStorage.getItem("corbyte_panier");


if(panier){

panier = JSON.parse(panier);

}

else{

panier=[];

}



let pc={

nom:"Corbyte Shadow",

prix:1295,

image:"shadow-pc.png"

};



panier.push(pc);



localStorage.setItem(

"corbyte_panier",

JSON.stringify(panier)

);



document.getElementById("compteur").innerHTML = panier.length;



document.getElementById("message").innerHTML = "✅ PC ajouté au panier";


}




function afficherCompteur(){


let panier = localStorage.getItem("corbyte_panier");


if(panier){


panier=JSON.parse(panier);


document.getElementById("compteur").innerHTML=panier.length;


}


}



afficherCompteur();


</script>


</body>

</html>
