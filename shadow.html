<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Corbyte Shadow</title>

<style>

body {
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}


.panier {

    position:fixed;
    top:20px;
    right:30px;

    background:#ff003c;
    padding:12px 20px;
    border-radius:12px;

}


.panier a {

    color:white;
    text-decoration:none;
    font-size:22px;

}


.card {

    width:600px;
    margin:60px auto;

    background:#111;

    border:2px solid #ff003c;

    border-radius:20px;

    padding:30px;

}


img {

    width:300px;

}


.prix {

    color:#ff003c;

    font-size:30px;

    font-weight:bold;

}


button {

    background:#ff003c;

    color:white;

    border:none;

    padding:15px 30px;

    border-radius:10px;

    cursor:pointer;

    font-size:18px;

}


#btn {

    margin-top:20px;

}


</style>

</head>


<body>


<div class="panier">

<a href="panier.html">

🛒 <span id="compteur">0</span>

</a>

</div>




<div class="card">


<h1>
CORBYTE SHADOW
</h1>



<img src="shadow-pc.png">



<h2>
PC Gaming RX 9060 XT
</h2>



<div class="prix">
1295 €
</div>



<p>

AMD Ryzen 7 5700X<br>
Sapphire RX 9060 XT 16 Go<br>
Patriot Viper Steel 16 Go DDR4<br>
Silicon Power NVMe 1 To<br>
MSI B550 Gaming WiFi<br>
Thermalright Assassin X120 ARGB<br>
MSI MAG A650BN 650W<br>
MSI MAG Forge 120A Airflow

</p>



<button id="btn" onclick="ajouterPanier()">

Ajouter au panier

</button>



</div>




<script>


function afficherCompteur(){

let panier = JSON.parse(localStorage.getItem("panier")) || [];

document.getElementById("compteur").innerHTML = panier.length;

}



function ajouterPanier(){


let panier = JSON.parse(localStorage.getItem("panier")) || [];


let pc = {

nom:"Corbyte Shadow",

prix:1295,

image:"shadow-pc.png"

};


panier.push(pc);


localStorage.setItem("panier", JSON.stringify(panier));


document.getElementById("btn").innerHTML="Ajouté ✓";


afficherCompteur();


}



afficherCompteur();



</script>


</body>

</html>
