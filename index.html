<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corbyte</title>

<style>
body{
    margin:0;
    background:#090909;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#07071a,#111,#120028);
}

h1{
    font-size:80px;
    color:#00d4ff;
    text-shadow:0 0 25px #00d4ff;
    margin:0;
}

p{
    font-size:22px;
    color:#ccc;
}

button{
    margin-top:30px;
    padding:15px 35px;
    background:#00d4ff;
    border:none;
    border-radius:12px;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}
</style>

</head>

<body>

<header>

<h1>CORBYTE</h1>

<p>Des performances sans compromis.</p>

<button>Découvrir nos PC</button>

</header>

</body>
</html>
