<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corbyte - PC Gaming</title>


<style>

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}


/* Logo */

header {
    padding: 20px 50px;
}


.logo img {
    width: 90px;
}



/* Partie principale */

.hero {

    display: flex;
    justify-content: space-around;
    align-items: center;

    min-height: 80vh;

    padding: 20px;

}



/* Texte */

.text {

    max-width: 550px;

}


h1 {

    font-size: 60px;
    margin: 0;

}


h1 span {

    color: #ff003c;

}



p {

    font-size: 22px;
    color: #cccccc;

}



/* Carré PC */

.pc {

    width: 350px;
    height: 250px;

    border: 2px solid #ff003c;
    border-radius: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

}



.pc img {

    max-width: 90%;
    max-height: 90%;

}



/* Bouton */

button {

    margin-top: 30px;

    padding: 15px 35px;

    background: #ff003c;

    color: white;

    border: none;

    border-radius: 10px;

    font-size: 18px;

    cursor: pointer;

}



button:hover {

    background: #ff3366;

}


</style>


</head>


<body>


<header>

<div class="logo">

<img src="Logo.png" alt="Logo Corbyte">

</div>

</header>



<section class="hero">



<div class="text">


<h1>
Le futur du <span>PC Gaming</span>
</h1>



<p>
Des PC puissants assemblés avec passion.
</p>



<a href="pc.html">

<button>
Découvrir nos PC
</button>

</a>



</div>




<div class="pc">

<img src="Logo.png" alt="Corbyte">

</div>



</section>



</body>


</html>
