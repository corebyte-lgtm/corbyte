<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Commande Corbyte</title>


<style>

body{

background:#050505;
color:white;
font-family:Arial;
text-align:center;

}


h1{

color:#ff003c;

}


.formulaire{

width:500px;
max-width:90%;

margin:40px auto;

background:#111;

border:2px solid #ff003c;

border-radius:20px;

padding:30px;

}



input{

width:90%;

padding:13px;

margin:10px;

border-radius:8px;

border:none;

}



button{

background:#ff003c;

color:white;

border:none;

padding:15px 30px;

border-radius:10px;

cursor:pointer;

}



#erreur{

color:red;

font-size:18px;

}


</style>


</head>


<body>


<h1>
Informations client
</h1>



<div class="formulaire">


<input id="nom" placeholder="Nom et prénom">

<input id="adresse" placeholder="Adresse">

<input id="code" placeholder="Code postal">

<input id="ville" placeholder="Ville">

<input id="mail" placeholder="Adresse mail">

<input id="telephone" placeholder="Numéro de téléphone">



<p id="erreur"></p>



<button onclick="continuer()">

Continuer

</button>



</div>




<script>


function continuer(){


let nom=document.getElementById("nom").value;

let adresse=document.getElementById("adresse").value;

let code=document.getElementById("code").value;

let ville=document.getElementById("ville").value;

let mail=document.getElementById("mail").value;

let telephone=document.getElementById("telephone").value;



if(
nom=="" ||
adresse=="" ||
code=="" ||
ville=="" ||
mail=="" ||
telephone==""

){


document.getElementById("erreur").innerHTML=

"⚠️ Merci de remplir tous les champs";


return;


}



let client={

nom,
adresse,
code,
ville,
mail,
telephone

};



localStorage.setItem("client",JSON.stringify(client));



window.location.href="recap.html";


}



</script>



</body>

</html>
