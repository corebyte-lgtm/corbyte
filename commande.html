<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Commande Corbyte</title>

<style>

body{

margin:0;
background:#050505;
color:white;
font-family:Arial;
text-align:center;

}


h1{

color:#ff003c;
margin-top:40px;

}



.box{

width:500px;
max-width:90%;

margin:40px auto;

background:#111;

border:2px solid #ff003c;

border-radius:20px;

padding:30px;

}



input{

width:90%;

padding:15px;

margin:10px;

border-radius:10px;

border:none;

font-size:16px;

}



button{

background:#ff003c;

color:white;

border:none;

padding:15px 35px;

border-radius:10px;

font-size:18px;

cursor:pointer;

}



</style>


</head>


<body>



<h1>

Informations de livraison

</h1>




<div class="box">



<input id="nom" placeholder="Nom complet">


<input id="adresse" placeholder="Adresse">


<input id="code" placeholder="Code postal">


<input id="email" placeholder="Adresse mail">


<input id="telephone" placeholder="Numéro de téléphone">



<br><br>



<button onclick="continuer()">

Continuer

</button>



</div>





<script>



function continuer(){



let nom=document.getElementById("nom").value;

let adresse=document.getElementById("adresse").value;

let code=document.getElementById("code").value;

let email=document.getElementById("email").value;

let telephone=document.getElementById("telephone").value;




if(

nom==="" ||

adresse==="" ||

code==="" ||

email==="" ||

telephone===""

){


alert("Veuillez remplir tous les champs");


return;


}




let client={


nom:nom,

adresse:adresse,

code:code,

email:email,

telephone:telephone


};



localStorage.setItem(

"client",

JSON.stringify(client)

);



window.location.href="recapitulatif.html";



}



</script>



</body>


</html>
