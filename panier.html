<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Panier Corbyte</title>

<style>

body{

margin:0;
background:#050505;
color:white;
font-family:Arial;
text-align:center;

}


h1{

color:#ff003c;
margin-top:40px;

}


.panier-box{

width:700px;
max-width:90%;

margin:40px auto;

background:#111;

border:2px solid #ff003c;

border-radius:20px;

padding:30px;

}



.produit img{

width:150px;

border-radius:15px;

}



.prix{

color:#ff003c;

font-size:25px;

font-weight:bold;

}



.quantite{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin:20px;

}



.quantite button{

width:45px;

height:45px;

font-size:25px;

padding:0;

}



button{

background:#ff003c;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

font-size:17px;

}



</style>

</head>


<body>



<h1>
Votre panier 🛒
</h1>




<div class="panier-box" id="contenu">

</div>





<script>



function afficherPanier(){


let panier = JSON.parse(localStorage.getItem("panier")) || [];


let contenu = document.getElementById("contenu");



if(panier.length === 0){


contenu.innerHTML = "Votre panier est vide";


return;


}



let total = 0;

let html = "";




panier.forEach((pc,index)=>{


let sousTotal = pc.prix * pc.quantite;


total += sousTotal;



html += `


<div class="produit">


<img src="${pc.image}">



<h2>

${pc.nom}

</h2>



<p>

Prix unitaire : ${pc.prix} €

</p>




<div class="quantite">


<button onclick="moins(${index})">

-

</button>



<h2>

${pc.quantite}

</h2>




<button onclick="plus(${index})">

+

</button>



</div>




<div class="prix">

Sous-total : ${sousTotal} €

</div>



<br>



<button onclick="supprimer(${index})">

🗑️ Supprimer

</button>


</div>



<hr>


`;



});




html += `


<h2>

Total : ${total} €

</h2>



<a href="commande.html">

<button>

Commander

</button>

</a>


`;



contenu.innerHTML = html;



}




function plus(index){


let panier = JSON.parse(localStorage.getItem("panier")) || [];


panier[index].quantite++;


localStorage.setItem("panier",JSON.stringify(panier));


afficherPanier();


}




function moins(index){


let panier = JSON.parse(localStorage.getItem("panier")) || [];



if(panier[index].quantite > 1){


panier[index].quantite--;


}

else{


panier.splice(index,1);


}



localStorage.setItem("panier",JSON.stringify(panier));


afficherPanier();


}




function supprimer(index){


let panier = JSON.parse(localStorage.getItem("panier")) || [];


panier.splice(index,1);


localStorage.setItem("panier",JSON.stringify(panier));


afficherPanier();


}




afficherPanier();



</script>



</body>

</html>
