<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Panier Corbyte</title>

</head>


<body style="background:#050505;color:white;text-align:center;font-family:Arial;">


<h1 style="color:#ff003c;">
Mon panier
</h1>



<div id="contenu">


</div>



<script>


let pc = localStorage.getItem("corbyte_pc");

let prix = localStorage.getItem("corbyte_prix");



if(pc){


document.getElementById("contenu").innerHTML =

`

<h2>${pc}</h2>

<h3>${prix} €</h3>

<button onclick="supprimer()">

🗑️ Supprimer

</button>

`;

}


else{


document.getElementById("contenu").innerHTML=

"Panier vide";


}




function supprimer(){

localStorage.clear();

location.reload();

}


</script>


</body>

</html>
