<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Panier Corbyte</title>


<style>

body {

background:#050505;
color:white;
font-family:Arial;

}



h1 {

text-align:center;
color:#ff003c;

}



.card {

width:500px;

margin:50px auto;

background:#111;

border:2px solid #ff003c;

border-radius:20px;

padding:20px;

}



button {

background:#ff003c;

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;

}



</style>


</head>


<body>


<h1>
Mon panier
</h1>



<div class="card" id="contenu">

</div>



<script>


let produit = localStorage.getItem("panier");

let prix = localStorage.getItem("prix");



if(produit){


document.getElementById("contenu").innerHTML=`

<h2>${produit}</h2>

<p>${prix} €</p>

<button onclick="supprimer()">

🗑️ Supprimer

</button>

`;



}

else{


document.getElementById("contenu").innerHTML="Panier vide";


}



function supprimer(){

localStorage.clear();

location.reload();

}



</script>


</body>

</html>
