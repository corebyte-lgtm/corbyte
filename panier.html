<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Panier Corbyte</title>


<style>

body {

background:#050505;
color:white;
font-family:Arial;

}


h1 {

text-align:center;
color:#ff003c;

}



.panier-box {

width:500px;

margin:50px auto;

background:#111;

border:2px solid #ff003c;

border-radius:20px;

padding:25px;

text-align:center;

}



button {

background:#ff003c;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

font-size:16px;

}


</style>


</head>


<body>


<h1>
Votre panier
</h1>



<div class="panier-box" id="panier">


</div>



<script>


let produit = localStorage.getItem("produit");

let prix = localStorage.getItem("prix");



if(produit){


document.getElementById("panier").innerHTML = `


<h2>${produit}</h2>


<p>${prix} €</p>


<button onclick="supprimer()">

🗑️ Supprimer

</button>


<br><br>


<button>

Commander

</button>


`;


}

else{


document.getElementById("panier").innerHTML="Votre panier est vide";


}



function supprimer(){

localStorage.clear();

location.reload();

}


</script>



</body>

</html>
