<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Panier Corbyte</title>


<style>

body {

margin:0;
background:#050505;
color:white;
font-family:Arial;

}


h1 {

text-align:center;
color:#ff003c;

}


.box {

width:600px;
margin:50px auto;
background:#111;
border:2px solid #ff003c;
border-radius:20px;
padding:25px;

}



.produit {

display:flex;
align-items:center;
gap:20px;
border-bottom:1px solid #333;
padding:15px;

}


.produit img {

width:100px;

}


button {

background:#ff003c;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;

}


</style>


</head>


<body>


<h1>
Votre panier
</h1>


<div class="box" id="contenu">

</div>



<script>


function afficherPanier(){


let panier = JSON.parse(localStorage.getItem("panier")) || [];


let contenu = document.getElementById("contenu");



if(panier.length === 0){

contenu.innerHTML="Votre panier est vide";

return;

}



let html="";

let total=0;



panier.forEach((pc,index)=>{


total += pc.prix;


html += `

<div class="produit">

<img src="${pc.image}">

<div>

<h2>${pc.nom}</h2>

<p>${pc.prix} €</p>


<button onclick="supprimer(${index})">

🗑️

</button>


</div>

</div>


`;



});



html += `

<h2>Total : ${total} €</h2>


<button>

Commander

</button>

`;



contenu.innerHTML=html;


}



function supprimer(index){


let panier = JSON.parse(localStorage.getItem("panier")) || [];


panier.splice(index,1);


localStorage.setItem("panier",JSON.stringify(panier));


afficherPanier();


}



afficherPanier();


</script>


</body>

</html>
