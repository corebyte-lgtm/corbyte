<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Panier Corbyte</title>


<style>

body{

background:#050505;

color:white;

font-family:Arial;

text-align:center;

}



h1{

color:#ff003c;

}



.box{

width:700px;

max-width:90%;

margin:40px auto;

background:#111;

border:2px solid #ff003c;

border-radius:20px;

padding:30px;

}



img{

width:150px;

}



.prix{

color:#ff003c;

font-size:25px;

font-weight:bold;

}



button{

background:#ff003c;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

}



</style>


</head>


<body>


<h1>
Votre panier
</h1>



<div class="box" id="contenu">

</div>




<script>



function afficherPanier(){


let panier = JSON.parse(localStorage.getItem("panier")) || [];

let contenu=document.getElementById("contenu");



if(panier.length===0){


contenu.innerHTML="Panier vide";

return;


}



let total=0;

let html="";



panier.forEach((pc,index)=>{


let sousTotal = pc.prix * pc.quantite;


total += sousTotal;



html += `


<img src="${pc.image}">


<h2>${pc.nom}</h2>


<p>

Quantité : ${pc.quantite}

</p>


<p>

Prix unitaire : ${pc.prix} €

</p>


<div class="prix">

Sous-total : ${sousTotal} €

</div>



<button onclick="retirer(${index})">

🗑️ Supprimer 1

</button>


<hr>


`;



});



html += `


<h2>

Total : ${total} €

</h2>



<a href="commande.html">

<button>

Commander

</button>

</a>


`;



contenu.innerHTML=html;


}




function retirer(index){


let panier = JSON.parse(localStorage.getItem("panier")) || [];



if(panier[index].quantite > 1){


panier[index].quantite--;


}

else{


panier.splice(index,1);


}



localStorage.setItem("panier",JSON.stringify(panier));



afficherPanier();


}




afficherPanier();


</script>



</body>

</html>
