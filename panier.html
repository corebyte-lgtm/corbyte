<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Panier Corbyte</title>


<style>

body {

background:#050505;

color:white;

font-family:Arial;

text-align:center;

}


h1 {

color:#ff003c;

}


.box {

width:500px;

margin:50px auto;

background:#111;

border:2px solid #ff003c;

border-radius:20px;

padding:25px;

}



img {

width:120px;

}



button {

background:#ff003c;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

}


</style>

</head>


<body>


<h1>
Mon panier
</h1>



<div class="box" id="panier">


</div>




<script>


let produits = JSON.parse(localStorage.getItem("panier")) || [];


let zone = document.getElementById("panier");



if(produits.length === 0){


zone.innerHTML="Panier vide";


}

else{


let pc = produits[0];


zone.innerHTML = `

<img src="${pc.image}">

<h2>${pc.nom}</h2>

<p>${pc.prix} €</p>

<button onclick="supprimer()">

🗑️ Supprimer

</button>

`;

}



function supprimer(){


localStorage.removeItem("panier");

location.reload();


}


</script>


</body>

</html>
