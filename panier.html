<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>Panier Corbyte</title>

<style>

body {

    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;

}


h1 {

    color:#ff003c;
    margin-top:40px;

}


.panier-box {

    width:600px;
    max-width:90%;

    margin:50px auto;

    background:#111;

    border:2px solid #ff003c;

    border-radius:20px;

    padding:30px;

}



.produit {

    display:flex;

    align-items:center;

    justify-content:center;

    gap:30px;

}



.produit img {

    width:150px;

}



.prix {

    color:#ff003c;

    font-size:28px;

    font-weight:bold;

}



button {

    background:#ff003c;

    color:white;

    border:none;

    padding:15px 30px;

    border-radius:10px;

    cursor:pointer;

    font-size:17px;

}



a {

    text-decoration:none;

}


</style>

</head>


<body>


<h1>
Votre panier
</h1>



<div class="panier-box" id="contenu">


</div>




<script>


let panier = JSON.parse(localStorage.getItem("panier")) || [];


let contenu = document.getElementById("contenu");



if(panier.length === 0){


contenu.innerHTML = "Votre panier est vide";


}


else{


let pc = panier[0];


contenu.innerHTML = `


<div class="produit">


<img src="${pc.image}">


<div>

<h2>${pc.nom}</h2>


<div class="prix">

${pc.prix} €

</div>


<br>


<button onclick="supprimer()">

🗑️ Supprimer

</button>


</div>


</div>


<br><br>


<a href="commande.html">

<button>

Commander

</button>

</a>


`;

}




function supprimer(){


localStorage.removeItem("panier");


location.reload();


}


</script>



</body>

</html>
